name: Validate published evaluation
on:
  push:
  pull_request:
jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published aggregates and scorecard
        run: python3 scripts/validate_results.py
